[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdm"
version = "1.0.0"
readme = "README.md"
dependencies = [
    "click",
    "opencv-python>=4.14,<5",
    "scipy",
    "matplotlib",
    "trimesh",
    "pillow",
    "huggingface_hub",
    "numpy",
    "torch==2.6.0",
    "torchvision",
]
requires-python = ">=3.9"

[project.optional-dependencies]
evaluation = [
    "scikit-image",
    "scikit-learn",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
