<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingBot Raw Point Cloud</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#dce8f4;font:14px system-ui}canvas{width:100%;height:100%;display:block}header{position:fixed;z-index:2;left:14px;right:14px;top:12px;display:flex;gap:10px;align-items:center;background:#0b121d;border:1px solid #26384d;border-radius:8px;padding:10px 13px}a{color:#66d8ff;text-decoration:none;margin-left:auto}.pill{color:#9fb2c7}@media(max-width:600px){header{flex-wrap:wrap}header b{flex:1 0 100%}header .pill{flex:1 1 auto}header a{margin-left:0}}</style></head><body><header><b>LingBot D435 Raw Point Cloud</b><span class="pill" id="status">connecting…</span><span class="pill" id="fps">-- FPS</span><a href="/">Realtime</a><a href="/snapshot">Snapshot</a></header><canvas id="c"></canvas><script>
(()=>{const c=document.getElementById('c'),gl=c.getContext('webgl2'),S={yaw:.15,pitch:-.12,d:2.8,drag:false,x:0,y:0,head:null},$=id=>document.getElementById(id);let prog,pb,cb,n=0;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,`#version 300 es\nin vec3 p;in vec4 c;out vec4 C;uniform float y,q,d,a;void main(){vec3 v=p;float cy=cos(y),sy=sin(y),cp=cos(q),sp=sin(q);v=vec3(cy*v.x+sy*v.z,v.y,-sy*v.x+cy*v.z);v=vec3(v.x,cp*v.y-sp*v.z,sp*v.y+cp*v.z);v.z-=d;gl_Position=vec4(v.x*1.6/a,v.y*1.6,-1.004*v.z-.1,-v.z);gl_PointSize=2.;C=c/255.;}`));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,`#version 300 es\nprecision mediump float;in vec4 C;out vec4 o;void main(){if(distance(gl_PointCoord,vec2(.5))>.5)discard;o=C;}`));gl.linkProgram(prog);pb=gl.createBuffer();cb=gl.createBuffer();gl.enable(gl.DEPTH_TEST);
function consume(b){const v=new DataView(b),p=new Float32Array((b.byteLength/16)*3),col=new Uint8Array((b.byteLength/16)*4);for(let i=0;i<b.byteLength/16;i++){for(let j=0;j<3;j++)p[i*3+j]=v.getFloat32(i*16+j*4,true);for(let j=0;j<4;j++)col[i*4+j]=v.getUint8(i*16+12+j)}n=p.length/3;gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,p,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,col,gl.STATIC_DRAW)}
function ws(){const p=location.protocol==='https:'?'wss:':'ws:',w=new WebSocket(`${p}//${location.host}/ws/pointcloud`);w.binaryType='arraybuffer';w.onmessage=e=>{if(typeof e.data==='string'){const h=JSON.parse(e.data);S.head=h;if(h.type==='ready')$('status').textContent='single shared camera worker';if(h.type==='frame')$('fps').textContent=`${h.points} points`;return}consume(e.data)};w.onclose=()=>setTimeout(ws,800);w.onerror=()=>w.close()}ws();
function draw(){const r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=r.width*dpr|0,h=r.height*dpr|0;if(c.width!==w||c.height!==h){c.width=w;c.height=h}gl.viewport(0,0,w,h);gl.clearColor(.004,.007,.011,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(n){gl.useProgram(prog);let l=gl.getAttribLocation(prog,'p');gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,0,0);l=gl.getAttribLocation(prog,'c');gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,4,gl.UNSIGNED_BYTE,false,0,0);for(const [k,v] of [['y',S.yaw],['q',S.pitch],['d',S.d],['a',w/h]])gl.uniform1f(gl.getUniformLocation(prog,k),v);gl.drawArrays(gl.POINTS,0,n)}requestAnimationFrame(draw)}draw();c.onpointerdown=e=>{S.drag=true;S.x=e.clientX;S.y=e.clientY};c.onpointermove=e=>{if(!S.drag)return;S.yaw+=(e.clientX-S.x)*.008;S.pitch=Math.max(-1.4,Math.min(1.4,S.pitch+(e.clientY-S.y)*.008));S.x=e.clientX;S.y=e.clientY};c.onpointerup=()=>S.drag=false;c.onwheel=e=>{e.preventDefault();S.d=Math.max(.3,Math.min(10,S.d+e.deltaY*.002))};})();
</script></body></html>
